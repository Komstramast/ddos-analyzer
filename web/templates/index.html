<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DDoS Traffic Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .status-indicator { font-size: 5rem; line-height: 1; transition: all 0.3s; }
        
        /* Переопределяем цвет muted, чтобы он был виден на темном фоне */
        .text-muted { color: #9e9e9e !important; }
        
        .text-green { color: #2ecc71; text-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }
        .text-yellow { color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }
        .text-red { color: #e74c3c; text-shadow: 0 0 10px rgba(231, 76, 60, 0.4); }
        
        .metric-value { font-size: 2.5rem; font-weight: bold; margin-bottom: 0; }
        .metric-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .alert-row td { vertical-align: middle; }
        
        /* Принудительно делаем весь текст белым/светлым */
        h1, h2, h3, h4, h5, h6 {
            color: #ffffff !important;
        }
        
        /* Убедимся, что текст в карточках тоже светлый */
        .card {
            color: #e0e0e0;
        }
        
        /* Делаем заголовки таблицы чуть более тусклыми, но видимыми */
        .table-dark th {
            color: #adb5bd;
            border-bottom-color: #495057;
        }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-4">
    <!-- Заголовок страницы -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">DDoS Traffic Analyzer</h2>
        <span class="badge bg-primary fs-6">Панель мониторинга</span>
    </div>

    <div class="row mb-4">
        <!-- Индикатор -->
        <div class="col-md-3">
            <div class="card text-center py-4 h-100 d-flex flex-column justify-content-center align-items-center">
                <h6 class="text-muted metric-title mb-3">Текущий статус</h6>
                <div id="status-icon" class="status-indicator text-green">🟢</div>
                <h4 id="status-text" class="mt-3 mb-0 fw-bold">Норма</h4>
            </div>
        </div>
        
        <!-- Метрики -->
        <div class="col-md-9">
            <div class="card h-100 p-4 d-flex flex-row justify-content-around align-items-center">
                <div class="text-center">
                    <h6 class="text-muted metric-title">Пакетов в секунду (PPS)</h6>
                    <p id="val-pps" class="metric-value text-info">0</p>
                </div>
                <div class="text-center border-start border-end border-dark px-5">
                    <h6 class="text-muted metric-title">Уникальных IP-источников</h6>
                    <p id="val-uniq" class="metric-value text-warning">0</p>
                </div>
                <div class="text-center">
                    <h6 class="text-muted metric-title">Энтропия (Шеннона)</h6>
                    <p id="val-entropy" class="metric-value text-success">0.00</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- График -->
        <div class="col-md-8">
            <div class="card p-3 h-100 d-flex flex-column">
                <h5 class="mb-3">Интенсивность трафика (PPS)</h5>
                <!-- Обертка для графика, чтобы он занимал всё оставшееся место -->
                <div class="chart-container" style="position: relative; flex-grow: 1; min-height: 300px;">
                    <canvas id="trafficChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Лента алертов -->
        <div class="col-md-4">
            <div class="card p-3" style="height: 100%; max-height: 400px; overflow-y: auto;">
                <h5 class="mb-3">Журнал событий</h5>
                <table class="table table-dark table-sm table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Время</th>
                            <th>Тип</th>
                            <th>Источник</th>
                        </tr>
                    </thead>
                    <tbody id="alerts-body">
                        <tr><td colspan="3" class="text-muted text-center py-3">Нет событий</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
